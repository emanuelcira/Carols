<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RBCSF Caroling 2026</title>
    <meta name="theme-color" content="#f5f6f8" id="themeColor">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script>
        // Apply the saved theme before the page paints, so it never flashes
        (function () {
            var t = null;
            try { t = localStorage.getItem('carols-theme'); } catch (e) {}
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        :root {
            --bg: #f5f6f8;
            --surface: #ffffff;
            --surface-2: #eef0f4;
            --border: #e2e5eb;
            --text: #141a2b;
            --text-2: #5b6377;
            --text-3: #8b92a3;
            --accent: #1f3466;
            --accent-hover: #182a54;
            --accent-text: #ffffff;
            --accent-soft: #e6eaf3;
            --overlay: rgba(10, 14, 26, 0.45);
            --shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
            --radius: 14px;
        }

        :root[data-theme="dark"] {
            --bg: #0d111b;
            --surface: #161b28;
            --surface-2: #1e2433;
            --border: #262d3e;
            --text: #eef1f7;
            --text-2: #a3abbd;
            --text-3: #6f7890;
            --accent: #9db3e6;
            --accent-hover: #b6c7ee;
            --accent-text: #0d111b;
            --accent-soft: #1f2a44;
            --overlay: rgba(0, 0, 0, 0.6);
            --shadow: none;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        button { font: inherit; color: inherit; }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 12px 16px calc(32px + env(safe-area-inset-bottom));
        }

        /* Top bar */
        .topbar {
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            justify-content: flex-end;
            padding: calc(12px + env(safe-area-inset-top)) 16px 0;
        }

        .container { padding-top: 0; }

        /* Page-wide text size (main page + schedule) */
        .scalable { zoom: var(--page-zoom, 1); }

        /* Text size + theme control group */
        .controls {
            display: inline-flex;
            align-items: center;
            height: 40px;
            padding: 3px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            flex-shrink: 0;
        }

        .ctrl {
            width: 34px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            border-radius: 999px;
            color: var(--text-2);
            cursor: pointer;
            transition: background-color 0.12s, color 0.12s;
        }

        .ctrl:hover { color: var(--text); }
        .ctrl:active { background: var(--surface-2); }
        .ctrl:disabled { opacity: 0.3; cursor: default; }
        .ctrl svg { width: 17px; height: 17px; }
        .a-small { font-size: 12px; font-weight: 700; }
        .a-large { font-size: 17px; font-weight: 700; }

        .ctrl-divider {
            width: 1px;
            height: 18px;
            background: var(--border);
            margin: 0 2px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-2);
            cursor: pointer;
            transition: background-color 0.15s, color 0.15s;
            flex-shrink: 0;
        }

        .icon-btn:hover { color: var(--text); }
        .icon-btn:active { background: var(--surface-2); }
        .icon-btn svg { width: 18px; height: 18px; }
        .icon-btn:disabled { opacity: 0.35; cursor: default; }

        .theme-toggle .icon-sun { display: none; }
        :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
        :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

        /* Header */
        header {
            text-align: center;
            padding: 4px 0 24px;
        }

        .logo {
            display: block;
            width: 112px;
            height: 112px;
            margin: -8px auto -4px;
        }

        .logo-dark { display: none; }
        :root[data-theme="dark"] .logo-light { display: none; }
        :root[data-theme="dark"] .logo-dark { display: block; }

        .church-name {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 6px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-top: 6px;
            line-height: 1.15;
            color: var(--text);
        }

        h1 .alt {
            display: block;
            font-weight: 500;
            color: var(--text-2);
            font-size: 20px;
            letter-spacing: -0.01em;
            margin-top: 2px;
        }

        /* Schedule */
        .section-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin: 0 4px 8px;
        }

        .schedule-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .schedule-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            cursor: pointer;
            text-align: left;
            transition: border-color 0.15s, transform 0.1s;
        }

        .schedule-btn:hover { border-color: var(--accent); }
        .schedule-btn:active { transform: scale(0.98); }

        .date-badge {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--accent);
            color: var(--accent-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
            flex-shrink: 0;
        }

        .date-badge .m { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; }
        .date-badge .d { font-size: 19px; font-weight: 700; margin-top: 2px; }

        @media (max-width: 480px) {
            .schedule-btn { flex-direction: column; align-items: flex-start; gap: 10px; }
        }

        .schedule-btn .t1 { display: block; font-size: 15px; font-weight: 600; color: var(--text); }
        .schedule-btn .t2 { display: block; font-size: 13px; color: var(--text-2); margin-top: 1px; }

        /* Search + filters */
        .search-wrap {
            position: relative;
            margin-bottom: 10px;
        }

        .search-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-3);
            pointer-events: none;
        }

        .search-box {
            width: 100%;
            padding: 13px 40px 13px 42px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 16px;
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .search-box::placeholder { color: var(--text-3); }

        .search-box:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .search-box::-webkit-search-cancel-button { display: none; }

        .clear-search {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: var(--text-3);
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .clear-search.visible { display: flex; }
        .clear-search svg { position: static; transform: none; width: 16px; height: 16px; }

        .filter-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 4px;
            background: var(--surface-2);
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .filter-btn {
            padding: 9px 6px;
            background: transparent;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-2);
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s, color 0.15s;
        }

        .filter-btn.active {
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.1);
        }

        :root[data-theme="dark"] .filter-btn.active { background: var(--border); box-shadow: none; }

        .result-count {
            font-size: 13px;
            color: var(--text-3);
            margin: 0 4px 8px;
        }

        /* Carol list */
        .carol-list {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .carol-item {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 14px 14px 14px 16px;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            text-align: left;
            cursor: pointer;
            transition: background-color 0.12s;
        }

        .carol-item:last-child { border-bottom: none; }
        .carol-item:hover { background: var(--surface-2); }
        .carol-item:active { background: var(--surface-2); }

        .carol-num {
            min-width: 28px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-3);
            font-variant-numeric: tabular-nums;
        }

        .carol-main { flex: 1; min-width: 0; }

        .carol-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
        }

        .carol-subtitle {
            font-size: 13px;
            color: var(--text-2);
            margin-top: 1px;
        }

        .chevron { width: 16px; height: 16px; color: var(--text-3); flex-shrink: 0; }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-2);
            font-size: 15px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-3);
            margin-top: 28px;
        }

        /* Sheets (lyrics + schedule) */
        .sheet {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--overlay);
            z-index: 1000;
        }

        .sheet.active {
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .sheet-panel {
            background: var(--surface);
            width: 100%;
            max-width: 640px;
            height: calc(100% - 24px - env(safe-area-inset-top));
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.22s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(16px); }
            to { transform: translateY(0); }
        }

        @media (min-width: 700px) {
            .sheet.active { align-items: center; padding: 32px; }
            .sheet-panel { height: auto; max-height: 88vh; border-radius: 20px; }
        }

        .sheet-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 18px 16px 14px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .sheet-heading { flex: 1; min-width: 0; }

        .sheet-title {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.25;
            color: var(--text);
        }

        .sheet-subtitle {
            font-size: 14px;
            color: var(--text-2);
            margin-top: 3px;
        }

        .sheet-actions { display: flex; align-items: center; gap: 8px; }
        .sheet-header .controls { background: var(--surface-2); border-color: transparent; }

        .sheet-body {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding: 20px 20px calc(32px + env(safe-area-inset-bottom));
        }

        /* Lyrics */
        .lyrics-text {
            font-size: var(--lyrics-size, 20px);
            line-height: 1.75;
            white-space: pre-line;
            color: var(--text);
        }

        .lyrics-footer {
            display: flex;
            gap: 10px;
            margin-top: 28px;
        }

        .nav-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
        }

        .nav-btn:disabled { opacity: 0.35; cursor: default; }
        .nav-btn:not(:disabled):active { background: var(--surface-2); }
        .nav-btn svg { width: 16px; height: 16px; }


        /* Schedule sheet */
        .location-group { margin-bottom: 22px; }
        .location-group:last-child { margin-bottom: 0; }

        .city-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
        }

        .stop {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 12px 12px 14px;
            background: var(--surface-2);
            border-radius: 12px;
            margin-bottom: 8px;
            text-decoration: none;
            color: inherit;
            transition: background-color 0.12s;
        }

        .stop:hover { background: var(--border); }

        .stop-num {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--accent-text);
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .stop-main { flex: 1; min-width: 0; }
        .stop-name { font-size: 16px; font-weight: 600; color: var(--text); }
        .stop-address { font-size: 14px; color: var(--text-2); margin-top: 1px; }

        .stop-map {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 11px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--accent-text);
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background-color 0.12s;
        }

        .stop:hover .stop-map { background: var(--accent-hover); }
        .stop-map svg { width: 15px; height: 15px; }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="topbar">
                <div class="controls" role="group" aria-label="Display">
                    <button class="ctrl js-smaller" aria-label="Smaller text"><span class="a-small">A</span></button>
                    <button class="ctrl js-larger" aria-label="Larger text"><span class="a-large">A</span></button>
                    <span class="ctrl-divider"></span>
                    <button class="ctrl theme-toggle js-theme" aria-label="Switch light / dark mode">
                        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    </button>
                </div>
    </div>

    <div class="container scalable">

        <header>
            <img class="logo logo-light" src="logo.png" alt="RBCSF">
            <img class="logo logo-dark" src="logo-white.png" alt="RBCSF">
            <h1>RBCSF Caroling 2026</h1>
        </header>

        <p class="section-label">Program / Schedule</p>
        <div class="schedule-buttons">
            <button class="schedule-btn" id="dec24Btn">
                <span class="date-badge"><span class="m">DEC</span><span class="d">24</span></span>
                <span><span class="t1">Christmas Eve</span><span class="t2">After youth service</span></span>
            </button>
            <button class="schedule-btn" id="dec25Btn">
                <span class="date-badge"><span class="m">DEC</span><span class="d">25</span></span>
                <span><span class="t1">Christmas Day</span><span class="t2">After evening service</span></span>
            </button>
        </div>

        <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" class="search-box" id="searchBox" placeholder="Caută colinde / Search carols" autocomplete="off">
            <button class="clear-search" id="clearSearch" aria-label="Clear search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>

        <div class="filter-container">
            <button class="filter-btn active" id="allBtn">Toate / All</button>
            <button class="filter-btn" id="romanianBtn">🇷🇴 Română</button>
            <button class="filter-btn" id="englishBtn">🇺🇸 English</button>
        </div>

        <p class="result-count" id="resultCount"></p>
        <div class="carol-list" id="carolList"></div>
        <div class="no-results" id="noResults" style="display: none;">
            Nu s-au găsit colinde / No carols found
        </div>

        <footer>RBCSF · Crăciun Fericit / Merry Christmas</footer>
    </div>

    <div class="sheet" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="sheet-panel">
            <div class="sheet-header">
                <div class="sheet-heading">
                    <h2 class="sheet-title" id="modalTitle"></h2>
                    <p class="sheet-subtitle" id="modalSubtitle"></p>
                </div>
                <div class="sheet-actions">
                <div class="controls" role="group" aria-label="Display">
                    <button class="ctrl js-smaller" aria-label="Smaller text"><span class="a-small">A</span></button>
                    <button class="ctrl js-larger" aria-label="Larger text"><span class="a-large">A</span></button>
                    <span class="ctrl-divider"></span>
                    <button class="ctrl theme-toggle js-theme" aria-label="Switch light / dark mode">
                        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    </button>
                </div>
                    <button class="icon-btn" id="closeBtn" aria-label="Close">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>
            <div class="sheet-body" id="lyricsBody">
                <div class="lyrics-text" id="lyricsText"></div>
                <div class="lyrics-footer">
                    <button class="nav-btn" id="prevBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                        Previous
                    </button>
                    <button class="nav-btn" id="nextBtn">
                        Next
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="sheet" id="scheduleModal" role="dialog" aria-modal="true" aria-labelledby="scheduleTitle">
        <div class="sheet-panel">
            <div class="sheet-header">
                <div class="sheet-heading">
                    <h2 class="sheet-title" id="scheduleTitle"></h2>
                    <p class="sheet-subtitle" id="scheduleSubtitle"></p>
                </div>
                <div class="sheet-actions">
                <div class="controls" role="group" aria-label="Display">
                    <button class="ctrl js-smaller" aria-label="Smaller text"><span class="a-small">A</span></button>
                    <button class="ctrl js-larger" aria-label="Larger text"><span class="a-large">A</span></button>
                    <span class="ctrl-divider"></span>

                const item = document.createElement('button');
                item.className = 'carol-item';
                item.innerHTML = `
                    <span class="carol-num">${escapeHtml(t.num)}</span>
                    <span class="carol-main">
                        <span class="carol-title" style="display:block">${escapeHtml(t.name)}</span>
                        <span class="carol-subtitle" style="display:block">${LANG_LABEL[carol.language] || ''}</span>
                    </span>
                    ${CHEVRON}`;
                item.onclick = () => openCarol(i);
                frag.appendChild(item);
            });
            carolList.appendChild(frag);
        }

        function filterCarols() {
            const term = normalize(searchBox.value.trim());
            clearSearch.classList.toggle('visible', searchBox.value.length > 0);

            let filtered = carols;
            if (currentFilter !== 'all') filtered = filtered.filter(c => c.language === currentFilter);
            if (term) filtered = filtered.filter(c => normalize(c.title).includes(term) || normalize(c.lyrics).includes(term));
            renderCarols(filtered);
        }

        function setActiveFilter(filter) {
            currentFilter = filter;
            Object.entries(filterButtons).forEach(([key, btn]) => btn.classList.toggle('active', key === filter));
            filterCarols();
        }
        Object.entries(filterButtons).forEach(([key, btn]) => btn.addEventListener('click', () => setActiveFilter(key)));

        searchBox.addEventListener('input', filterCarols);
        clearSearch.addEventListener('click', () => { searchBox.value = ''; filterCarols(); searchBox.focus(); });

        // ---------- Lyrics ----------
        function openCarol(index) {
            const carol = visibleCarols[index];
            if (!carol) return;
            currentIndex = index;
            const t = splitTitle(carol.title);
            modalTitle.textContent = t.name;
            modalSubtitle.textContent = (t.num ? '#' + t.num + '  ·  ' : '') + (LANG_LABEL[carol.language] || '');
            lyricsText.innerHTML = carol.lyrics;
            prevBtn.disabled = index <= 0;
            nextBtn.disabled = index >= visibleCarols.length - 1;
            lyricsBody.scrollTop = 0;
            if (openSheet !== modal) showSheet(modal);
        }
        function stepCarol(dir) { openCarol(currentIndex + dir); }
        prevBtn.onclick = () => stepCarol(-1);
        nextBtn.onclick = () => stepCarol(1);

        // Text size for reading outside in the dark
        // One shared text size: scales the page and the lyrics together
        const SIZES = [16, 18, 20, 23, 26, 30];
        const ZOOMS = [0.9, 0.95, 1, 1.08, 1.16, 1.25];
        let sizeIndex = 2;
        try { const s = parseInt(localStorage.getItem('carols-size'), 10); if (SIZES[s]) sizeIndex = s; } catch (e) {}
        function applySize() {
            document.documentElement.style.setProperty('--lyrics-size', SIZES[sizeIndex] + 'px');
            document.documentElement.style.setProperty('--page-zoom', ZOOMS[sizeIndex]);
            document.querySelectorAll('.js-smaller').forEach(b => b.disabled = sizeIndex === 0);
            document.querySelectorAll('.js-larger').forEach(b => b.disabled = sizeIndex === SIZES.length - 1);
            try { localStorage.setItem('carols-size', sizeIndex); } catch (e) {}
        }
        document.querySelectorAll('.js-smaller').forEach(b => b.onclick = () => { if (sizeIndex > 0) { sizeIndex--; applySize(); } });
        document.querySelectorAll('.js-larger').forEach(b => b.onclick = () => { if (sizeIndex < SIZES.length - 1) { sizeIndex++; applySize(); } });
        applySize();

        renderCarols(carols);
    </script>
</body>
</html>
